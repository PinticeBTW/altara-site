const tests = [];
function test(name, run) { tests.push({ name, run }); }
function assert(condition, message = "assertion_failed") {
  if (!condition) throw new Error(message);
}
function equal(actual, expected, message = "values_not_equal") {
  if (actual !== expected) throw new Error(`${message}: ${String(actual)} !== ${String(expected)}`);
}
async function rejects(run, expectedCode = "") {
  try { await run(); }
  catch (error) {
    if (expectedCode && String(error?.code || error?.name || "") !== expectedCode) {
      throw new Error(`unexpected_error_code:${String(error?.code || error?.name || "")}`);
    }
    return error;
  }
  throw new Error("expected_rejection");
}

function bytesToBase64Url(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

async function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("altara-dm-e2ee-v1", 3);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains("identityKeys")) db.createObjectStore("identityKeys", { keyPath: "userId" });
      if (!db.objectStoreNames.contains("identityKeysV2")) db.createObjectStore("identityKeysV2", { keyPath: "userId" });
      if (!db.objectStoreNames.contains("pendingIdentityRestarts")) db.createObjectStore("pendingIdentityRestarts", { keyPath: "userId" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function idbRequest(storeName, mode, operation) {
  const db = await openDb();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, mode);
      const request = operation(tx.objectStore(storeName));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      tx.onabort = () => reject(tx.error || new Error("idb_abort"));
    });
  } finally {
    db.close();
  }
}
const idbGet = (store, key) => idbRequest(store, "readonly", (objectStore) => objectStore.get(key));
const idbPut = (store, value) => idbRequest(store, "readwrite", (objectStore) => objectStore.put(value));
const idbDelete = (store, key) => idbRequest(store, "readwrite", (objectStore) => objectStore.delete(key));

async function createLegacyFixture(userId, storage = "idb_pkcs8") {
  const pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const publicKeyJwk = await crypto.subtle.exportKey("jwk", pair.publicKey);
  const privateKeyJwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
  const privateKeyPkcs8 = bytesToBase64Url(new Uint8Array(await crypto.subtle.exportKey("pkcs8", pair.privateKey)));
  const record = {
    userId,
    keyId: "",
    keyVersion: 1,
    keyAlgorithm: "ECDH-P256",
    publicKeyJwk,
    ...(storage === "idb_crypto" ? { privateKey: pair.privateKey } : { privateKeyPkcs8 }),
  };
  if (storage === "local_pkcs8") {
    localStorage.setItem(`altara.dm_e2ee.identity.v1.${encodeURIComponent(userId)}`, JSON.stringify(record));
  } else {
    await idbPut("identityKeys", record);
  }
  return { pair, publicKeyJwk, privateKeyJwk, privateKeyPkcs8 };
}

async function deriveBits(privateKey, publicKey) {
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "ECDH", public: publicKey }, privateKey, 256));
}
function bytesEqual(left, right) {
  if (left.length !== right.length) return false;
  let difference = 0;
  for (let index = 0; index < left.length; index += 1) difference |= left[index] ^ right[index];
  return difference === 0;
}

for (const [table, method, mode] of [

  ['dm_e2ee_key_backups', '', 'corrupt'],

    equal(server.getKey(userId), null, 'unverified_identity_published');
    equal(await idbGet('identityKeysV2', userId), undefined, 'unverified_identity_hardened');

});

test("non-extractable identity still performs required ECDH", async () => {
  const peer = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
  const localPublic = await crypto.subtle.importKey(
    "jwk",
    context.newIdentity.publicKeyJwk,
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
  const left = await deriveBits(context.newIdentity.privateKey, peer.publicKey);
  const right = await deriveBits(peer.privateKey, localPublic);
  assert(bytesEqual(left, right), "ecdh_secret_mismatch");
  left.fill(0);
  right.fill(0);
});

test("legacy extractable CryptoKey migrates through explicit encrypted recovery", async () => {
  const userId = "legacy-crypto-user";
  const legacy = await createLegacyFixture(userId, "idb_crypto");
  server.setCurrentUser(userId);
  const originalExportKey = crypto.subtle.exportKey.bind(crypto.subtle);
  let legacyPrivateExports = 0;
  crypto.subtle.exportKey = async (format, key) => {
    if (format === "jwk" && key?.type === "private" && key?.extractable === true) {
      legacyPrivateExports += 1;
    }
    return originalExportKey(format, key);
  };
  try {
    const preflight = await vault.getDmE2eeIdentityState({ userId, force: true });
    equal(preflight.status, "migration_requires_recovery");
    equal(legacyPrivateExports, 0);
    const migrated = await vault.setupDmE2eeIdentityForCurrentDevice({
      userId,
      backupPassword: "legacy crypto password",
      includeRecoveryKey: false,
    });
    equal(migrated.status, "ready");
    equal(migrated.privateKey.extractable, false);
    equal(legacyPrivateExports, 1);
    equal(await idbGet("identityKeys", userId), undefined);
    context.legacyCryptoPrivateD = legacy.privateKeyJwk.d;
  } finally {
    crypto.subtle.exportKey = originalExportKey;
  }
});

test("failed localStorage migration does not delete the recoverable legacy record", async () => {
  const userId = "failed-local-migration";
  await createLegacyFixture(userId, "local_pkcs8");
  const storageKey = `altara.dm_e2ee.identity.v1.${encodeURIComponent(userId)}`;
  const before = localStorage.getItem(storageKey);
  server.setCurrentUser(userId);
  const originalPut = IDBObjectStore.prototype.put;
  IDBObjectStore.prototype.put = function (...args) {
    if (this.name === "identityKeysV2") throw new DOMException("synthetic put failure", "UnknownError");
    return originalPut.apply(this, args);
  };
  try {
    const result = await vault.setupDmE2eeIdentityForCurrentDevice({
      userId,
      backupPassword: "failed local password",
      includeRecoveryKey: false,
    });
    equal(result.status, "error");
    equal(localStorage.getItem(storageKey), before);
  } finally {
    IDBObjectStore.prototype.put = originalPut;
  }

  const originalRemoveItem = Storage.prototype.removeItem;
  Storage.prototype.removeItem = function (key) {
    if (key === storageKey) throw new DOMException("synthetic cleanup failure", "UnknownError");
    return originalRemoveItem.call(this, key);
  };
  try {
    const cleanupFailed = await vault.setupDmE2eeIdentityForCurrentDevice({
      userId,
      backupPassword: "failed local password",
      includeRecoveryKey: false,
    });
    equal(cleanupFailed.status, "error");
    assert(await idbGet("identityKeysV2", userId), "hardened_record_missing_after_cleanup_failure");
    equal(localStorage.getItem(storageKey), before);
  } finally {
    Storage.prototype.removeItem = originalRemoveItem;
  }
  const resumed = await vault.getDmE2eeIdentityState({ userId, force: true });
  equal(resumed.status, "ready");
  equal(localStorage.getItem(storageKey), null);
});

  for (const userId of ["isolation-a", "isolation-b"]) {
    server.setCurrentUser(userId);
    const identity = await vault.setupDmE2eeIdentityForCurrentDevice({
      userId,
      backupPassword: `password for ${userId}`,
      includeRecoveryKey: false,
    });

});

async function seedMissingRestartUser(userId) {
  vault.clearDmE2eeMemory();
  server.setCurrentUser(userId);
  const pair = await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]);
  const publicKeyJwk = await crypto.subtle.exportKey("jwk",pair.publicKey);
  server.setKey(userId,{id:`old-${userId}`,key_version:1,key_algorithm:"ECDH-P256",public_key_jwk:publicKeyJwk,revoked_at:null});
  return {userId,expectedKeyId:`old-${userId}`,password:"Synthetic restart recovery phrase 42!",acknowledgeHistoryLoss:true,confirmRecoveryKey:async()=>true};
}

test("Vault media round trips between participants without exposing its key or filename", async () => {
  const sender = context["isolation-a"], recipient = context["isolation-b"];
  const conversationId = crypto.randomUUID(), messageId = crypto.randomUUID(), fileId = crypto.randomUUID();
  const mediaCrypto = await import('/public/app/lib/vaultMediaCrypto.js');
  const file = new File(['GIF89a confidential fixture'], 'private-file.gif', { type: 'image/gif' });
  const encryptedFile = await mediaCrypto.encryptVaultFile(file, { conversationId, messageId, fileId });
  const descriptor = { fileId, uploadId: crypto.randomUUID(), key: encryptedFile.key, name: file.name, mime: file.type, size: file.size, encryptedSize: encryptedFile.blob.size };
  server.setCurrentUser(sender.userId);
  const payload = await vault.buildEncryptedDmMessagePayload({ conversationId, messageId, userId: sender.userId, otherUserId: recipient.userId,
    media: { type: 'vault_media', version: 1, conversationId, messageId, files: [descriptor] } });
  equal(payload.cipher_version, 2);
  assert(!JSON.stringify(payload).includes(descriptor.key)); assert(!JSON.stringify(payload).includes(file.name));
  const wire = { ...payload, id: messageId, conversation_id: conversationId, user_id: sender.userId, dm_privacy_epoch: 1 };
  for (const userId of [sender.userId, recipient.userId]) {
    server.setCurrentUser(userId);
    const [row] = await vault.decryptDmMessageRows({ userId, conversationId, rows: [wire] });
    const manifest = vault.getTrustedVaultMedia(row);
    assert(manifest); equal(vault.getTrustedDmE2eeText(row), null);
    equal(await (await mediaCrypto.decryptVaultFile(encryptedFile.blob, manifest.files[0], { conversationId, messageId, fileId })).text(), await file.text());
    equal(vault.getTrustedVaultMedia(JSON.parse(JSON.stringify(row))), null);
    assert(!JSON.stringify(row).includes(descriptor.key)); assert(!JSON.stringify(row).includes(file.name));
    equal(vault.getTrustedVaultMedia({ ...row, user_id: 'another-user' }), null);
    equal(vault.getTrustedVaultMedia({ ...row, deleted_at: new Date().toISOString() }), null);
    const [moved] = await vault.decryptDmMessageRows({ userId, conversationId, rows: [{ ...wire, id: crypto.randomUUID() }] });
    equal(vault.getTrustedVaultMedia(moved), null);
  }
});
