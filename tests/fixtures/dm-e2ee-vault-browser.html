const tests = [];
function test(name, run) { tests.push({ name, run }); }
function assert(condition, message = "assertion_failed") {
  if (!condition) throw new Error(message);
}
function equal(actual, expected, message = "values_not_equal") {
  if (actual !== expected) throw new Error(`${message}: ${String(actual)} !== ${String(expected)}`);
}
async function rejects(run, expectedCode = "") {
  try { await run(); }
  catch (error) {
    if (expectedCode && String(error?.code || error?.name || "") !== expectedCode) {
      throw new Error(`unexpected_error_code:${String(error?.code || error?.name || "")}`);
    }
    return error;
  }
  throw new Error("expected_rejection");
}

function bytesToBase64Url(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

async function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("altara-dm-e2ee-v1", 2);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains("identityKeys")) db.createObjectStore("identityKeys", { keyPath: "userId" });
      if (!db.objectStoreNames.contains("identityKeysV2")) db.createObjectStore("identityKeysV2", { keyPath: "userId" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function idbRequest(storeName, mode, operation) {
  const db = await openDb();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, mode);
      const request = operation(tx.objectStore(storeName));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      tx.onabort = () => reject(tx.error || new Error("idb_abort"));
    });
  } finally {
    db.close();
  }
}
const idbGet = (store, key) => idbRequest(store, "readonly", (objectStore) => objectStore.get(key));
const idbPut = (store, value) => idbRequest(store, "readwrite", (objectStore) => objectStore.put(value));
const idbDelete = (store, key) => idbRequest(store, "readwrite", (objectStore) => objectStore.delete(key));

async function createLegacyFixture(userId, storage = "idb_pkcs8") {
  const pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const publicKeyJwk = await crypto.subtle.exportKey("jwk", pair.publicKey);
  const privateKeyJwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
  const privateKeyPkcs8 = bytesToBase64Url(new Uint8Array(await crypto.subtle.exportKey("pkcs8", pair.privateKey)));
  const record = {
    userId,
    keyId: "",
    keyVersion: 1,
    keyAlgorithm: "ECDH-P256",
    publicKeyJwk,
    ...(storage === "idb_crypto" ? { privateKey: pair.privateKey } : { privateKeyPkcs8 }),
  };
  if (storage === "local_pkcs8") {
    localStorage.setItem(`altara.dm_e2ee.identity.v1.${encodeURIComponent(userId)}`, JSON.stringify(record));
  } else {
    await idbPut("identityKeys", record);
  }
  return { pair, publicKeyJwk, privateKeyJwk, privateKeyPkcs8 };
}

async function deriveBits(privateKey, publicKey) {
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "ECDH", public: publicKey }, privateKey, 256));
}
function bytesEqual(left, right) {
  if (left.length !== right.length) return false;
  let difference = 0;
  for (let index = 0; index < left.length; index += 1) difference |= left[index] ^ right[index];
  return difference === 0;
}

test("non-extractable identity still performs required ECDH", async () => {
  const peer = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
  const localPublic = await crypto.subtle.importKey(
    "jwk",
    context.newIdentity.publicKeyJwk,
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
  const left = await deriveBits(context.newIdentity.privateKey, peer.publicKey);
  const right = await deriveBits(peer.privateKey, localPublic);
  assert(bytesEqual(left, right), "ecdh_secret_mismatch");
  left.fill(0);
  right.fill(0);
});

test("protected identity recovery credentials can be authenticated and rewrapped", async () => {
  const previousPasswordCiphertext = context.passwordMethod.encrypted_private_key;
  const nextPassword = "updated correct horse battery staple";
  const updated = await vault.rewrapDmE2eeKeyBackup({
    userId: context.newUserId,
    currentPassword: context.password,
    currentMethod: "password",
    newPassword: nextPassword,
    includeRecoveryKey: true,
  });
  assert(updated?.recoveryKey, "rewrap_recovery_key_missing");
  const nextPasswordMethod = server.getMethod(context.newUserId, "password");
  const nextRecoveryMethod = server.getMethod(context.newUserId, "recovery_key");
  assert(nextPasswordMethod.encrypted_private_key !== previousPasswordCiphertext, "rewrap_ciphertext_unchanged");
  const oldCredentialError = await rejects(() => vault.restoreDmE2eeKeyBackup({
    userId: context.newUserId,
    password: context.password,
  }));
  equal(oldCredentialError.code, "dm_e2ee_backup_bad_password");
  const restored = await vault.restoreDmE2eeKeyBackup({ userId: context.newUserId, password: nextPassword });
  equal(restored.privateKey.extractable, false);
  equal(restored.publicKeyJwk.x, context.newIdentity.publicKeyJwk.x);
  context.password = nextPassword;
  context.recoveryKey = updated.recoveryKey;
  context.passwordMethod = nextPasswordMethod;
  context.recoveryMethod = nextRecoveryMethod;
});

test("legacy extractable CryptoKey migrates through explicit encrypted recovery", async () => {
  const userId = "legacy-crypto-user";
  const legacy = await createLegacyFixture(userId, "idb_crypto");
  server.setCurrentUser(userId);
  const originalExportKey = crypto.subtle.exportKey.bind(crypto.subtle);
  let legacyPrivateExports = 0;
  crypto.subtle.exportKey = async (format, key) => {
    if (format === "jwk" && key?.type === "private" && key?.extractable === true) {
      legacyPrivateExports += 1;
    }
    return originalExportKey(format, key);
  };
  try {
    const preflight = await vault.getDmE2eeIdentityState({ userId, force: true });
    equal(preflight.status, "migration_requires_recovery");
    equal(legacyPrivateExports, 0);
    const migrated = await vault.setupDmE2eeIdentityForCurrentDevice({
      userId,
      backupPassword: "legacy crypto password",
      includeRecoveryKey: false,
    });
    equal(migrated.status, "ready");
    equal(migrated.privateKey.extractable, false);
    equal(legacyPrivateExports, 1);
    equal(await idbGet("identityKeys", userId), undefined);
    context.legacyCryptoPrivateD = legacy.privateKeyJwk.d;
  } finally {
    crypto.subtle.exportKey = originalExportKey;
  }
});

test("failed localStorage migration does not delete the recoverable legacy record", async () => {

  await createLegacyFixture(userId, "local_pkcs8");
  const storageKey = `altara.dm_e2ee.identity.v1.${encodeURIComponent(userId)}`;
  const before = localStorage.getItem(storageKey);
  server.setCurrentUser(userId);
  const originalPut = IDBObjectStore.prototype.put;
  IDBObjectStore.prototype.put = function (...args) {
    if (this.name === "identityKeysV2") throw new DOMException("synthetic put failure", "UnknownError");
    return originalPut.apply(this, args);
  };
  try {
    const result = await vault.setupDmE2eeIdentityForCurrentDevice({
      userId,
      backupPassword: "failed local password",
      includeRecoveryKey: false,
    });
    equal(result.status, "error");
    equal(localStorage.getItem(storageKey), before);
  } finally {
    IDBObjectStore.prototype.put = originalPut;
  }

  const originalRemoveItem = Storage.prototype.removeItem;
  Storage.prototype.removeItem = function (key) {
    if (key === storageKey) throw new DOMException("synthetic cleanup failure", "UnknownError");
    return originalRemoveItem.call(this, key);
  };
  try {
    const cleanupFailed = await vault.setupDmE2eeIdentityForCurrentDevice({
      userId,
      backupPassword: "failed local password",
      includeRecoveryKey: false,
    });
    equal(cleanupFailed.status, "error");
    assert(await idbGet("identityKeysV2", userId), "hardened_record_missing_after_cleanup_failure");
    equal(localStorage.getItem(storageKey), before);
  } finally {
    Storage.prototype.removeItem = originalRemoveItem;
  }
  const resumed = await vault.getDmE2eeIdentityState({ userId, force: true });
  equal(resumed.status, "ready");
  equal(localStorage.getItem(storageKey), null);
});

  server.setCurrentUser("isolation-a");
  const aAgain = await vault.ensureDmE2eeIdentity({ userId: "isolation-a" });
  equal(aAgain.publicKeyJwk.x, context["isolation-a"].publicKeyJwk.x);
  assert(aAgain.publicKeyJwk.x !== context["isolation-b"].publicKeyJwk.x, "cross_account_identity_reuse");
});

test("existing Vault message encryption and decryption remain compatible", async () => {
  const sender = context["isolation-a"];
  const recipient = context["isolation-b"];
  server.setCurrentUser(sender.userId);
  const encrypted = await vault.buildEncryptedDmMessagePayload({
    conversationId: "synthetic-conversation",
    userId: sender.userId,
    otherUserId: recipient.userId,
    content: "synthetic historical message",
  });
  server.setCurrentUser(recipient.userId);
  const [decrypted] = await vault.decryptDmMessageRows({
    userId: recipient.userId,
    conversationId: "synthetic-conversation",
    rows: [{
      id: "synthetic-message",
      user_id: sender.userId,
      ...encrypted,
    }],
  });
  equal(decrypted.content, "synthetic historical message");
  equal(decrypted.e2eeState, "ready");
});

test("errors and diagnostics do not contain private-key material", async () => {
  const serializedLogs = capturedLogs.join("\n");
  assert(!serializedLogs.includes(context.legacyCryptoPrivateD), "private_jwk_logged");
  assert(!serializedLogs.includes(context.pkcs8Migration.legacy.privateKeyPkcs8), "pkcs8_logged");
  assert(!serializedLogs.includes(context.password), "recovery_password_logged");
  assert(!serializedLogs.includes(context.recoveryKey), "recovery_key_logged");
});

test("production recovery-first setup UI executes the exact site app integration", async () => {
  const source = await (await fetch(`/public/app/app.js?v=${Date.now()}`)).text();
  const start = source.indexOf("async function setupNewDmE2eeKeyFromSettings()");
  const end = source.indexOf("\nasync function promptRestoreDmE2eeBackupFromDm()", start);
  assert(start >= 0 && end > start, "site_setup_function_missing");
  const functionSource = source.slice(start, end);
  const passwordInput = document.createElement("input");
  passwordInput.id = "settingsDmE2eeBackupPassword";
  passwordInput.value = "synthetic migration recovery password";
  const confirmInput = document.createElement("input");
  confirmInput.id = "settingsDmE2eeBackupPasswordConfirm";
  confirmInput.value = passwordInput.value;
  document.body.append(passwordInput, confirmInput);
  const calls = [];
  const dependencyNames = [
    "isDirectDmE2eeEnabled", "DIRECT_DM_E2EE_KEY_BACKUP_UI_ENABLED", "state",
    "settingsDmE2eeBackupSetupInFlight", "DM_E2EE_BACKUP_PASSWORD_MIN_LENGTH",
    "showSecurityDialogMessage", "tf", "t", "showVaultRecoveryResponsibilityNotice",
    "requestAppConfirm", "renderDmE2eeBackupSettingsUi", "setupDmE2eeIdentityForCurrentDevice",
    "DM_E2EE_BACKUP_PASSWORD_SOURCE_MANUAL", "showVaultRecoveryKeyOnce",
    "clearDmE2eeBackupInputs", "dmE2eeBootstrapPromise", "ensureDmE2eeBootstrapStarted",
    "refreshDmE2eeBackupSettingsState",
  ];
  const dependencyValues = [
    () => true, true, { user: { id: "synthetic-ui-user" } }, false, 6,
    async (message) => calls.push(["message", message]),
    (_key, _values, fallback) => fallback,
    (_key, fallback) => fallback,
    async () => true,
    async () => true,
    () => calls.push(["render"]),
    async (options) => {
      calls.push(["setup", options]);
      return { status: "ready", recoveryKey: "ALTARA-TEST-TEST-TEST-TEST-TEST-TEST-TEST-TEST" };
    },
    "manual",
    async () => { calls.push(["recovery-key-shown"]); return true; },
    () => calls.push(["clear"]),
    null,
    async () => calls.push(["bootstrap"]),
    async () => calls.push(["refresh"]),
  ];
  try {
    const setup = Function(...dependencyNames, `${functionSource}; return setupNewDmE2eeKeyFromSettings;`)(...dependencyValues);
    await setup();
    const setupCall = calls.find(([kind]) => kind === "setup");
    assert(setupCall, "migration_setup_not_called");
    equal(setupCall[1].userId, "synthetic-ui-user");
    equal(setupCall[1].backupPassword, passwordInput.value);
    equal(setupCall[1].passwordSource, "manual");
    equal(setupCall[1].includeRecoveryKey, true);
    equal(setupCall[1].forceNew, false);
    assert(calls.some(([kind]) => kind === "recovery-key-shown"), "recovery_key_not_presented");
    assert(calls.some(([kind]) => kind === "bootstrap"), "authoritative_bootstrap_not_refreshed");
    assert(calls.some(([kind]) => kind === "refresh"), "settings_state_not_refreshed");
  } finally {
    passwordInput.remove();
    confirmInput.remove();
  }
});

test("production migration recovery state renders the credentialed setup action", async () => {

  const start = source.indexOf("function renderDmE2eeRecoveryState()");
  const end = source.indexOf("\nfunction isDmE2eeReadyForInteraction()", start);

  const functionSource = source.slice(start, end);
  const messages = document.createElement("div");
  messages.id = "dmMessages";
  document.body.append(messages);
  const dependencyNames = [
    "isDirectDmE2eeEnabled", "document", "dmE2eeReadiness", "t", "activeDmId", "state",
    "dmMessagesCache", "logChatMessagesRenderDiagnostic", "preserveComposerDuring", "esc",

const failures = [];
let passed = 0;
for (const entry of tests) {
  try {
    await entry.run();
    passed += 1;
  } catch (error) {
    failures.push({ name: entry.name, message: String(error?.message || error || "unknown") });
  }
}
const summary = { total: tests.length, passed, failed: failures.length, failures };
resultElement.dataset.status = failures.length ? "fail" : "pass";
resultElement.textContent = JSON.stringify(summary);
