<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Spotify connection — ALTARA</title>
  <style>
    :root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101010;color:#f4f4f4;font-family:system-ui,sans-serif}main{box-sizing:border-box;width:min(420px,calc(100vw - 32px));padding:28px;border:1px solid #ffffff20;border-radius:14px;background:#191919;text-align:center}h1{font-size:22px}p{color:#b8b8b8;line-height:1.5}.btn{display:inline-block;padding:12px 18px;border-radius:8px;background:#303030;color:#fff;text-decoration:none}.btn:focus-visible{outline:2px solid #d3bea1;outline-offset:3px}
  </style>
  <script src="./callback.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">Couldn't connect Spotify.</h1>
    <p id="message">Return to ALTARA and try connecting again.</p>
    <a class="btn" id="return" href="/app.html">Return to ALTARA</a>
  </main>
</body>
</html>
