    <p class="eyebrow">A LITTLE EVERY DAY</p>
    <h1>Your progress</h1>
    <output id="count" aria-live="polite">0</output>
    <div class="actions">

    </div>
    <p id="status" role="status" data-altara-widget-role="muted">Your counter, your pace.</p>
